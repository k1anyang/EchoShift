[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echoshift"
version = "1.0.0"
description = "Audio and video to MP3 converter with QQ Music (MFLAC/MGG/QMC) decryption, sample-rate and bitrate control"
requires-python = ">=3.10"
# The application itself uses only the standard library; ffmpeg ships in
# vendor/. Everything here is a development-time extra.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "pillow>=9.0"]
build = ["pyinstaller>=6.0"]

[project.scripts]
echoshift = "echoshift.cli:main"
echoshift-gui = "echoshift.gui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
markers = [
    "slow: end-to-end tests that run ffmpeg over generated audio",
]
